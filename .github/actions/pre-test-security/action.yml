name: Pre-test security
description: Gitleaks, Trivy filesystem scan and TruffleHog against the checked-out repository.

inputs:
  gitleaks-version:
    description: Gitleaks docker image tag
    default: "v8.21.2"
  trufflehog-version:
    description: TruffleHog docker image tag
    default: "3.82.13"
  trivy-severity:
    description: Severities that fail the Trivy FS scan
    default: "CRITICAL,HIGH"
  trivy-exit-code:
    description: Exit code when Trivy finds issues (1 = fail, 0 = report only)
    default: "1"
  trufflehog-only-verified:
    description: Only fail on secrets TruffleHog can verify as live
    default: "true"

runs:
  using: composite
  steps:
    - name: "1/3 Gitleaks - secret scan"
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          "zricethezav/gitleaks:${{ inputs.gitleaks-version }}" \
          detect --source=/repo --config=/repo/.gitleaks.toml \
          --redact --verbose --exit-code 1

    - name: "2/3 Trivy - filesystem scan"
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: fs
        version: v0.69.3
        scan-ref: .
        scanners: vuln,secret,misconfig
        severity: ${{ inputs.trivy-severity }}
        ignore-unfixed: true
        exit-code: ${{ inputs.trivy-exit-code }}
        format: table

    - name: "3/3 TruffleHog - git history secret scan"
      shell: bash
      run: |
        VERIFIED=""
        if [ "${{ inputs.trufflehog-only-verified }}" = "true" ]; then
          VERIFIED="--only-verified"
        fi
        docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          "trufflesecurity/trufflehog:${{ inputs.trufflehog-version }}" \
          git file:///repo $VERIFIED --fail --no-update